[package]
name = "kissaki"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A bounded, scope-aware web crawler in safe Rust, inspired by Katana"
license = "MIT"
repository = "https://github.com/Zer0Dev-exe/Kissaki"
readme = "README.md"
keywords = ["crawler", "security", "reconnaissance", "cli"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
ipnet = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util"] }
url = { version = "2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
